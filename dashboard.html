<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CartShare - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">🛒 CartShare</span>
    <button id="logout-btn" class="btn btn-sm btn-light">Logout</button>
  </nav>

  <div class="container py-4">
    <h1 class="h3 mb-4" id="welcome"></h1>

    <div class="row g-3 mb-4">
      <div class="col-12 col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5">Create a room</h2>
            <p class="text-muted">Start a new shared cart. You'll get a code to share with friends.</p>
            <button id="create-btn" class="btn btn-success">Create New Room</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5">Join a room</h2>
            <form id="join-form" class="d-flex gap-2">
              <input type="text" id="room-code" class="form-control" placeholder="Room code"
                     pattern="[A-Za-z0-9]{3,12}" title="3 to 12 letters or numbers" required>
              <button type="submit" class="btn btn-primary">Join</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5">My rooms</h2>
        <div id="my-rooms"></div>
      </div>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
