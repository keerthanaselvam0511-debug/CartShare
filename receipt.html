<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CartShare - Receipt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 700px;">
    <div class="d-flex justify-content-between flex-wrap gap-2 mb-3 no-print">
      <a href="shop.html" class="btn btn-outline-secondary">← Back to shop</a>
      <div class="d-flex gap-2">
        <button id="copy-btn" class="btn btn-outline-primary">Copy summary</button>
        <button id="print-btn" class="btn btn-primary">Print Receipt</button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 text-center">🛒 CartShare Receipt</h1>
        <p class="text-center text-muted mb-1" id="receipt-room"></p>
        <p class="text-center text-muted mb-1" id="receipt-date"></p>
        <p class="text-center fw-semibold" id="delivery-status"></p>

        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Item</th>
                <th>Added by</th>
                <th class="text-end">Qty</th>
                <th class="text-end">Amount</th>
              </tr>
            </thead>
            <tbody id="receipt-rows"></tbody>
          </table>
        </div>

        <div class="d-flex justify-content-between fw-bold fs-5">
          <span>Grand total</span><span id="receipt-total"></span>
        </div>

        <hr>
        <h2 class="h6">Split by person</h2>
        <ul id="split-list" class="list-unstyled mb-0"></ul>
      </div>
    </div>
  </div>

  <script src="js/receipt.js"></script>
</body>
</html>
