<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CartShare - Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">🛒 CartShare</span>
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <span class="text-white" id="user-info"></span>
      <a href="dashboard.html" class="btn btn-sm btn-light">Dashboard</a>
      <button id="logout-btn" class="btn btn-sm btn-outline-light">Logout</button>
    </div>
  </nav>

  <div class="container-fluid py-4 px-3 px-md-4">
    <div class="row g-4">
      <div class="col-12 col-lg-8">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 class="h4 mb-0">Products</h2>
          <div class="position-relative" style="max-width: 260px; width: 100%;">
  <input type="text" id="search" class="form-control pe-5"
         placeholder="Search products..." aria-label="Search products">
  <button type="button" id="clear-search"
          class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-1 d-none"
          aria-label="Clear search">✕</button>
</div>
        </div>
        <div id="filters" class="mb-3 d-flex flex-wrap gap-2"></div>
        <div id="product-grid" class="row g-3"></div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="card shadow-sm mb-3">
          <div class="card-body">
            <h2 class="h5">Shared Cart</h2>
            <div id="cart-items"></div>
            <hr>
            <div class="d-flex justify-content-between fw-bold">
              <span>Total</span><span id="cart-total">₹0</span>
            </div>
            <div class="progress mt-3" style="height: 14px;">
              <div id="progress-bar" class="progress-bar bg-success" style="width: 0%"></div>
            </div>
            <small id="progress-text" class="text-muted"></small>
            <a href="receipt.html" class="btn btn-primary w-100 mt-3">View Receipt</a>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5">Activity Log</h2>
            <ul id="activity-log" class="list-unstyled mb-0 small"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/shop.js"></script>
</body>
</html>
