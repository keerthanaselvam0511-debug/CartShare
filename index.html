<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CartShare - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 text-center mb-1">🛒 CartShare</h1>
            <p class="text-center text-muted mb-3">Shop together, split fairly.</p>

            <ul class="small text-muted mb-4">
              <li>Create a room and share the code with friends or roommates</li>
              <li>Everyone adds items to one shared cart, and you see who added what</li>
              <li>Print a receipt that splits the total by person</li>
            </ul>

            <div id="message" class="alert d-none" role="alert"></div>

            <form id="login-form">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-control" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" minlength="4" autocomplete="current-password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
              <button type="button" id="register-btn" class="btn btn-outline-secondary w-100 mt-2">Create Account</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
